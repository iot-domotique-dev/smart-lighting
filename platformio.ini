; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

default_envs = lamp_c6


[env]
monitor_speed = 115200


[env:esp32dev_base]

platform = espressif32
board = esp32dev
framework = arduino


[env:core]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_CORE


[env:main]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_MAIN


[env:relay]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_RELAY


; ESP-IDF is selected for C6 because the official ESP-Zigbee SDK 2.x is an
; ESP-IDF component. Hardware: Waveshare ESP32-C6-DEV-KIT-N8 (8 MB);
; PlatformIO's official DevKitC-1 profile matches its C6 and pinout.
[env:esp32c6_zigbee_base]
platform = espressif32@7.0.0
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_zigbee.csv


[env:main_light_c6]
extends = env:esp32c6_zigbee_base
build_flags =
    -D DEVICE_ROLE_MAIN
    -D SMART_LIGHTING_ZIGBEE


[env:lamp_c6]
extends = env:esp32c6_zigbee_base
build_flags =
    -D DEVICE_ROLE_LAMP
    -D SMART_LIGHTING_ZIGBEE
    -D SMART_LIGHTING_LED_GPIO=18


[env:native]

platform = native
test_framework = unity
test_build_src = yes

build_flags =
    -D DEVICE_ROLE_LAMP
    -I test/fakes

build_src_filter =
    +<action_executor.cpp>
    +<automation_engine.cpp>
    +<automation_manager.cpp>
    +<core_module_service.cpp>
    +<device_manager.cpp>
    +<device_registry.cpp>
    +<event_bus.cpp>
    +<group_command_handler.cpp>
    +<group_manager.cpp>
    +<lamp_controller.cpp>
    +<lamp_hardware_espidf.cpp>
    +<message_deduplicaor.cpp>
    +<message_id_generator.cpp>
    +<message_manager.cpp>
    +<message_router.cpp>
    +<message_tracker.cpp>
    +<provisioning.cpp>
    +<provisioning_store.cpp>
    +<simulation_transport.cpp>
    +<zigbee_message_codec.cpp>
    +<scene_executor.cpp>
    +<scene_manager.cpp>
