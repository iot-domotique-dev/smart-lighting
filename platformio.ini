; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

default_envs = lamp_c6


[env]
monitor_speed = 115200


[env:esp32dev_base]

platform = espressif32
board = esp32dev
framework = arduino


[env:core]
extends = env:core_wifi_c6


[env:main]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_MAIN


[env:relay]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_RELAY


; ESP-IDF is used by the C6 firmware targets.
[env:esp32c6_base]
platform = espressif32@7.0.0
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200

; The Zigbee stack is enabled only in environments based on this profile.
[env:esp32c6_zigbee_base]
extends = env:esp32c6_base
board_build.partitions = partitions_zigbee.csv
board_build.cmake_extra_args = -DSMART_LIGHTING_BUILD_ZIGBEE=ON

[env:core_wifi_c6]
extends = env:esp32c6_base
board_build.cmake_extra_args =
    -DSMART_LIGHTING_BUILD_ZIGBEE=OFF
    -DSMART_LIGHTING_BUILD_WIFI=ON
build_flags =
    -D DEVICE_ROLE_CORE
    -D SMART_LIGHTING_CORE_WIFI
    -D SMART_LIGHTING_CORE_UART
    -D CORE_LINK_UART_PORT=1
    -D CORE_LINK_UART_TX_PIN=4
    -D CORE_LINK_UART_RX_PIN=5
    -D CORE_LINK_UART_BAUD=115200

[env:core_zigbee_c6]
extends = env:esp32c6_zigbee_base
build_flags =
    -D DEVICE_ROLE_CORE
    -D SMART_LIGHTING_CORE_ZIGBEE
    -D SMART_LIGHTING_CORE_UART
    -D SMART_LIGHTING_ZIGBEE
    -D CORE_LINK_UART_PORT=1
    -D CORE_LINK_UART_TX_PIN=4
    -D CORE_LINK_UART_RX_PIN=5
    -D CORE_LINK_UART_BAUD=115200

[env:main_light_c6]
extends = env:esp32c6_zigbee_base
build_flags =
    -D DEVICE_ROLE_MAIN
    -D SMART_LIGHTING_ZIGBEE


[env:lamp_c6]
extends = env:esp32c6_zigbee_base
build_flags =
    -D DEVICE_ROLE_LAMP
    -D SMART_LIGHTING_ZIGBEE
    -D SMART_LIGHTING_LED_GPIO=18


[env:native]

platform = native
test_framework = unity
test_build_src = yes

build_flags =
    -D DEVICE_ROLE_LAMP
    -I test/fakes

build_src_filter =
    +<action_executor.cpp>
    +<automation_engine.cpp>
    +<automation_manager.cpp>
    +<core_module_service.cpp>
    +<core_link_codec.cpp>
    +<core_link_service.cpp>
    +<core_topology_protocol.cpp>
    +<device_manager.cpp>
    +<device_registry.cpp>
    +<event_bus.cpp>
    +<group_command_handler.cpp>
    +<group_manager.cpp>
    +<lamp_controller.cpp>
    +<lamp_hardware_espidf.cpp>
    +<message_deduplicaor.cpp>
    +<message_id_generator.cpp>
    +<message_manager.cpp>
    +<message_router.cpp>
    +<message_tracker.cpp>
    +<provisioning.cpp>
    +<provisioning_store.cpp>
    +<simulation_transport.cpp>
    +<zigbee_message_codec.cpp>
    +<scene_executor.cpp>
    +<scene_manager.cpp>
