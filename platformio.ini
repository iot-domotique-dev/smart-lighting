; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

default_envs = lamp


[env]
monitor_speed = 115200


[env:esp32dev_base]

platform = espressif32
board = esp32dev
framework = arduino


[env:core]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_CORE


[env:main]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_MAIN


[env:lamp]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_LAMP
    -D SMART_LIGHTING_DEMO


[env:relay]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_RELAY


[env:lamp_a]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_LAMP
    -D DEVICE_LAMP_A


[env:lamp_b]

extends = env:esp32dev_base
build_flags =
    -D DEVICE_ROLE_LAMP
    -D DEVICE_LAMP_B


[env:native]

platform = native
test_framework = unity
test_build_src = yes

build_flags =
    -D DEVICE_ROLE_LAMP
    -I test/fakes

build_src_filter =
    +<action_executor.cpp>
    +<automation_engine.cpp>
    +<automation_manager.cpp>
    +<device_manager.cpp>
    +<device_registry.cpp>
    +<event_bus.cpp>
    +<group_command_handler.cpp>
    +<group_manager.cpp>
    +<lamp_controller.cpp>
    +<message_deduplicaor.cpp>
    +<message_id_generator.cpp>
    +<message_manager.cpp>
    +<message_router.cpp>
    +<message_tracker.cpp>
    +<provisioning.cpp>
    +<provisioning_store.cpp>
    +<simulation_transport.cpp>
    +<scene_executor.cpp>
    +<scene_manager.cpp>
